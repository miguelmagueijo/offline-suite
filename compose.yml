name: offline-suite

services:
    app:
        build:
            context: .
        image: offline-suite
        restart: unless-stopped
        ports:
            - ${PORT:-3000}:3000
        environment:
            PORT: 3000
            ORIGIN: ${ORIGIN:?ORIGIN must be set in .env (e.g. https://example.com)}
            # Only needed when a reverse proxy sits in front and ORIGIN is not set.
            PROTOCOL_HEADER: ${PROTOCOL_HEADER:-}
            HOST_HEADER: ${HOST_HEADER:-}
            # Lets event.getClientAddress() see the real client IP behind a proxy.
            ADDRESS_HEADER: ${ADDRESS_HEADER:-}
            XFF_DEPTH: ${XFF_DEPTH:-1}
            BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-512K}
            SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30}
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
