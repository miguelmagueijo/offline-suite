<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Budget Planner</title>

  <script>
    (function () {
      var mode = "auto";
      try { mode = localStorage.getItem("budget-theme") || "auto"; } catch (e) {}
      var dark = mode === "dark" || (mode === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            income: "#2563eb"
          }
        }
      }
    };
  </script>

  <style>
    #income::-webkit-outer-spin-button, #income::-webkit-inner-spin-button,
    #duodecimos::-webkit-outer-spin-button, #duodecimos::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    #income, #duodecimos { -moz-appearance: textfield; appearance: textfield; }

    .expense-amount::-webkit-outer-spin-button,
    .expense-amount::-webkit-inner-spin-button,
    .category-percentage-input::-webkit-outer-spin-button,
    .category-percentage-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .expense-amount,
    .category-percentage-input {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    html { color-scheme: light; }
    html.dark { color-scheme: dark; }

      html.dark body { background: #0b1220; color: #e2e8f0; }
      html.dark .bg-slate-100 { background-color: #0b1220; }
      html.dark .bg-white { background-color: #111a2c; }
      html.dark .bg-slate-800 { background-color: #e2e8f0; color: #0f172a; }
      html.dark .hover\:bg-slate-700:hover { background-color: #cbd5e1; }
      html.dark .hover\:bg-slate-50:hover { background-color: #1a2740; }
      html.dark .hover\:bg-red-50:hover { background-color: #3b1219; }
      html.dark .bg-red-50 { background-color: #3b1219; }
      html.dark .bg-slate-100.rounded-full { background-color: #1e293b; }
      html.dark .text-slate-800, html.dark .text-slate-900 { color: #f1f5f9; }
      html.dark .text-slate-700 { color: #cbd5e1; }
      html.dark .text-slate-600 { color: #b6c2d3; }
      html.dark .text-slate-500 { color: #94a3b8; }
      html.dark .text-slate-400 { color: #7a8aa3; }
      html.dark .text-red-600, html.dark .text-red-500, html.dark .hover\:text-red-600:hover { color: #f87171; }
      html.dark .border-slate-100, html.dark .border-slate-200, html.dark .hover\:border-slate-200:hover { border-color: #1f2c44; }
      html.dark .border-slate-300 { border-color: #2a3a57; }
      html.dark .border-red-200, html.dark .border-red-300 { border-color: #7f1d1d; }
      html.dark .\!border-red-400 { border-color: #f87171 !important; }
      html.dark input, html.dark button { color-scheme: dark; }
      html.dark input[type="text"], html.dark input[type="number"] { background-color: transparent; color: #f1f5f9; }
      html.dark .expense-name, html.dark .expense-amount, html.dark #income, html.dark #duodecimos { background-color: #0b1220; }
      html.dark .field-main { background-color: #0b1220; color: #f1f5f9; border-color: #2a3a57; }
      html.dark .field-main:focus { border-color: #60a5fa; box-shadow: 0 0 0 2px rgba(96,165,250,.3); }
      html.dark input::placeholder { color: #566681; }
      html.dark .border-dashed { border-color: #2a3a57; }

    input[type="color"] {
      appearance: none;
      -webkit-appearance: none;
      padding: 0;
      border: 0;
      background: transparent;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 0;
      border-radius: 9999px;
    }
  </style>
</head>

<body class="min-h-screen bg-slate-100 text-slate-800">

<div class="max-w-7xl mx-auto px-4 py-6">

  <!-- Header -->
  <header class="mb-4">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">
          Budget Planner
        </h1>
        <p class="mt-0.5 text-sm text-slate-500">
          Customize your budget percentages and track where every euro goes.
        </p>
      </div>

      <div class="flex gap-2">
        <button
          id="themeBtn"
          type="button"
          class="h-8 px-3 text-sm rounded-md bg-white border border-slate-300 hover:bg-slate-50 transition"
          title="Theme: click to change"
        >
          🌓 Auto
        </button>

        <button
          id="exportBtn"
          class="h-8 px-3 text-sm rounded-md bg-slate-800 border border-transparent text-white hover:bg-slate-700 transition"
        >
          Export JSON
        </button>

        <label
          class="h-8 px-3 inline-flex items-center text-sm rounded-md bg-white border border-slate-300 hover:bg-slate-50 cursor-pointer transition"
        >
          Import JSON
          <input
            id="importInput"
            type="file"
            accept=".json,application/json"
            class="hidden"
          />
        </label>
      </div>
    </div>
  </header>


  <!-- OVERVIEW -->
  <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-4">

    <div class="flex flex-col gap-3">

      <div class="flex flex-wrap items-end gap-3 pb-3 border-b border-slate-100">
        <label class="block" title="Monthly net income">
          <span class="block text-[11px] font-semibold uppercase tracking-wide text-slate-500 mb-1">Monthly net income</span>
          <span class="relative block w-44">
            <input id="income" type="number" min="0" step="0.01" placeholder="2500"
              class="field-main w-full h-10 text-lg font-bold text-slate-800 bg-slate-50 border border-slate-300 rounded-md pl-3 pr-8 focus:outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200" />
            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm font-medium text-slate-400">€</span>
          </span>
        </label>
        <span class="h-10 flex items-center text-lg font-bold text-slate-400">+</span>
        <label class="block" title="Holiday + Christmas subsidies paid monthly">
          <span class="block text-[11px] font-semibold uppercase tracking-wide text-slate-500 mb-1">Duodécimos (monthly)</span>
          <span class="relative block w-44">
            <input id="duodecimos" type="number" min="0" step="0.01" placeholder="0"
              class="field-main w-full h-10 text-lg font-bold text-slate-800 bg-slate-50 border border-slate-300 rounded-md pl-3 pr-8 focus:outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200" />
            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm font-medium text-slate-400">€</span>
          </span>
        </label>
      </div>

      <div id="overviewCategories" class="flex flex-wrap gap-2"></div>

      <div>
        <div class="flex justify-between text-xs text-slate-500 mb-1.5">
          <span id="totalTracked" class="font-medium text-slate-700">€0.00 tracked</span>
          <span><span id="totalUnallocated">€0.00 unallocated</span> · <span id="overallPercentage">0%</span></span>
        </div>
        <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
          <div id="overallProgress" class="h-full bg-blue-600 rounded-full transition-all"></div>
        </div>
      </div>

    </div>

    <div id="percentWarning" class="hidden mt-3 text-xs font-medium text-red-600 bg-red-50 border border-red-200 rounded-md px-3 py-1.5"></div>

  </section>


  <!-- BUDGET -->
  <div>

    <main id="categories" class="grid grid-cols-1 lg:grid-cols-3 gap-4"></main>

  </div>


  <hr class="my-6 border-t-2 border-slate-300" />


  <!-- DUODÉCIMOS -->
  <div>

    <main id="duoCategory" class="grid grid-cols-1 lg:grid-cols-3 gap-4"></main>

  </div>


  <footer class="text-center text-xs text-slate-400 mt-6">
    Budget Planner
  </footer>

</div>


<script>

const STORAGE_KEY = "custom-budget-planner";

const DEFAULT_STATE = {
  income: 2500,

  duodecimos: 0,

  categories: [
    {
      id: "needs",
      name: "Needs",
      percentage: 50,
      color: "#16a34a",
      description: "Housing, utilities, food and essential costs.",
      expenses: []
    },

    {
      id: "wants",
      name: "Wants",
      percentage: 30,
      color: "#f59e0b",
      description: "Entertainment, restaurants, shopping and hobbies.",
      expenses: []
    },

    {
      id: "savings",
      name: "Savings",
      percentage: 20,
      color: "#8b5cf6",
      description: "Savings, investments and debt repayment.",
      expenses: []
    }
  ]
};


let state = loadState();


const currency = new Intl.NumberFormat("en-IE", {
  style: "currency",
  currency: "EUR"
});


function money(value) {
  return currency.format(Number(value) || 0);
}


function generateId() {
  if (crypto.randomUUID) {
    return crypto.randomUUID();
  }

  return Date.now() + "-" + Math.random();
}


function normalizeDuo(src) {
  src = src && typeof src === "object" ? src : {};
  return {
    id: "duodecimos",
    name: src.name || "Duodécimos",
    percentage: 0,
    color: /^#[0-9A-Fa-f]{6}$/.test(src.color || "") ? src.color : "#0ea5e9",
    description: "",
    fixed: true,
    expenses: Array.isArray(src.expenses) ? src.expenses : []
  };
}


function allCategories() {
  return [...state.categories, state.duo];
}


function cloneDefaultState() {
  const d = JSON.parse(JSON.stringify(DEFAULT_STATE));
  d.duo = normalizeDuo();
  return d;
}


function loadState() {

  const saved = localStorage.getItem(STORAGE_KEY);

  if (!saved) {
    return cloneDefaultState();
  }

  try {

    const parsed = JSON.parse(saved);

    if (
      !parsed ||
      typeof parsed !== "object" ||
      !Array.isArray(parsed.categories)
    ) {
      return cloneDefaultState();
    }

    return {
      income: Number(parsed.income) || 0,

      duodecimos: Math.max(0, Number(parsed.duodecimos) || 0),

      duo: normalizeDuo(parsed.duo),

      categories: parsed.categories.map((category, index) => ({
        id: category.id || generateId(),
        name: category.name || `Category ${index + 1}`,
        percentage: Number(category.percentage) || 0,
        color: category.color || "#64748b",
        description: category.description || "",
        expenses: Array.isArray(category.expenses)
          ? category.expenses
          : []
      }))
    };

  } catch {

    return cloneDefaultState();

  }
}


function saveState() {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );
}


function totalPercentage() {

  return state.categories.reduce(
    (total, category) =>
      total + Number(category.percentage || 0),
    0
  );

}


function totalBudget() {
  return state.income + state.duodecimos;
}


function totalTracked() {

  return allCategories().reduce(
    (total, category) => {

      return total + category.expenses.reduce(
        (sum, expense) =>
          sum + (Number(expense.amount) || 0),
        0
      );

    },
    0
  );

}


function categorySpent(category) {

  return category.expenses.reduce(
    (sum, expense) =>
      sum + (Number(expense.amount) || 0),
    0
  );

}


function categoryTarget(category) {

  if (category.fixed) {
    return state.duodecimos;
  }

  return state.income *
    (Number(category.percentage) || 0) /
    100;

}


function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function render() {

  document.getElementById("income").value =
    state.income || "";

  document.getElementById("duodecimos").value =
    state.duodecimos || "";

  renderCategories();

  renderOverview();

  applyPercentageWarning();

  saveState();

}


function renderCategories() {

  const mainContainer =
    document.getElementById("categories");

  const duoContainer =
    document.getElementById("duoCategory");

  mainContainer.innerHTML = "";

  duoContainer.innerHTML = "";

  allCategories().forEach(category => {

    const container =
      category.fixed ? duoContainer : mainContainer;

    const section =
      document.createElement("section");

    section.className =
      "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden";

    section.dataset.categoryId =
      category.id;

    section.innerHTML = `

      <!-- Category header -->

      <div class="p-4 border-b border-slate-100">

        <div class="flex items-center gap-2">

          <input
            type="color"
            class="category-color w-5 h-5 rounded-full cursor-pointer shrink-0"
            title="Change color"
            value="${escapeHtml(category.color)}"
          />

          <input
            type="text"
            class="category-name flex-1 min-w-0 text-base font-bold bg-transparent border border-transparent hover:border-slate-200 focus:border-blue-400 rounded-md px-2 h-8 focus:outline-none"
            placeholder="Title"
            value="${escapeHtml(category.name)}"
          />

          ${category.fixed ? `<div class="shrink-0 h-8 flex items-center text-[11px] font-semibold text-slate-400 uppercase tracking-wide pr-2">Fixed</div>` : `<div class="relative w-20 shrink-0">
            <input
              type="number"
              min="0"
              max="100"
              step="1"
              class="category-percentage-input w-full text-base font-bold text-right bg-transparent border border-transparent hover:border-slate-200 focus:border-blue-400 rounded-md pl-2 pr-6 h-8 focus:outline-none"
              value="${Number(category.percentage)}"
            />
            <span class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 text-sm">%</span>
          </div>`}

        </div>

        <div class="category-target text-xs text-slate-500 mt-1 text-right"></div>


        <!-- Progress -->

        <div class="mt-3">

          <div class="flex justify-between text-xs mb-1.5">

            <span class="text-slate-500">
              Used
            </span>

            <span>
              <strong class="category-spent">
                ${money(categorySpent(category))}
              </strong>

              /
              
              <strong>
                ${money(categoryTarget(category))}
              </strong>
            </span>

          </div>


          <div
            class="h-2 bg-slate-100 rounded-full overflow-hidden"
          >

            <div
              class="category-progress h-full rounded-full transition-all"
              style="background:${escapeHtml(category.color)}"
            ></div>

          </div>


          <div
            class="category-remaining mt-2 text-xs font-medium"
          ></div>

        </div>

      </div>


      <!-- Expenses + Add -->

      <div class="p-4 flex flex-col gap-2">

        <div class="expenses flex flex-col gap-2 empty:hidden"></div>

        <button
          class="add-expense w-full h-8 text-sm rounded-md border border-dashed border-slate-300 text-slate-500 transition"
        >
          + Add expense
        </button>

      </div>


    `;


    container.appendChild(section);

    setupCategoryEvents(
      section,
      category
    );

    renderExpenses(
      section,
      category
    );

    updateCategoryVisuals(
      section,
      category
    );

  });

}


function setupCategoryEvents(
  section,
  category
) {

  const nameInput =
    section.querySelector(".category-name");

  const percentageInput =
    section.querySelector(
      ".category-percentage-input"
    );

  const colorInput =
    section.querySelector(".category-color");

  const addButton =
    section.querySelector(".add-expense");


  nameInput.addEventListener(
    "input",
    () => {

      category.name =
        nameInput.value;

      update();

    }
  );


  if (percentageInput) {

  percentageInput.addEventListener(
    "input",
    () => {

      let value =
        Number(percentageInput.value);

      if (!Number.isFinite(value)) {
        value = 0;
      }

      value =
        Math.max(0, Math.min(100, value));

      category.percentage =
        value;

      percentageInput.value =
        value;

      update();

    }
  );

  }


  colorInput.addEventListener(
    "input",
    () => {

      category.color =
        colorInput.value;

      update();

    }
  );


  addButton.addEventListener(
    "click",
    () => {

      category.expenses.push({
        id: generateId(),
        name: "",
        amount: 0
      });

      saveState();

      render();

      const newSection =
        document.querySelector(
          `[data-category-id="${CSS.escape(category.id)}"]`
        );

      const inputs =
        newSection.querySelectorAll(
          ".expense-name"
        );

      if (inputs.length) {
        inputs[inputs.length - 1].focus();
      }

    }
  );

}


function renderExpenses(
  section,
  category
) {

  const container =
    section.querySelector(".expenses");

  container.innerHTML = "";


  category.expenses.forEach(
    expense => {

      const row =
        document.createElement("div");

      row.className =
        "expense-row flex gap-2 items-center";

      row.innerHTML = `

        <input
          type="text"
          value="${escapeHtml(expense.name)}"
          placeholder="Expense"
          class="expense-name flex-1 min-w-0 h-7 border border-slate-200 rounded-md px-2 text-sm focus:outline-none focus:border-blue-400"
        />


        <div class="relative w-20 shrink-0">

          <input
            type="number"
            min="0"
            step="0.01"
            value="${Number(expense.amount) || 0}"
            class="expense-amount w-full h-7 border border-slate-200 rounded-md pl-2 pr-6 text-sm text-right focus:outline-none focus:border-blue-400"
          />

          <span
            class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 text-xs"
          >
            €
          </span>

        </div>


        <span class="expense-pct w-9 shrink-0 text-[11px] leading-none tabular-nums text-slate-500 text-right"></span>


        <button
          type="button"
          class="delete-expense shrink-0 w-7 h-7 inline-flex items-center justify-center rounded-md text-slate-400 hover:text-red-600 hover:bg-red-50 transition"
          title="Delete expense"
          aria-label="Delete expense"
        >
          <svg viewBox="0 0 12 12" class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg>
        </button>

      `;


      const nameInput =
        row.querySelector(".expense-name");

      const amountInput =
        row.querySelector(".expense-amount");

      const deleteButton =
        row.querySelector(".delete-expense");


      nameInput.addEventListener(
        "input",
        () => {

          expense.name =
            nameInput.value;

          saveState();

        }
      );


      amountInput.addEventListener(
        "input",
        () => {

          expense.amount =
            Math.max(
              0,
              Number(amountInput.value) || 0
            );

          update();

        }
      );


      deleteButton.addEventListener(
        "click",
        () => {

          category.expenses =
            category.expenses.filter(
              item =>
                item.id !== expense.id
            );

          saveState();

          render();

        }
      );


      container.appendChild(row);

    }
  );

}


function updateCategoryVisuals(
  section,
  category
) {

  const spent =
    categorySpent(category);

  const target =
    categoryTarget(category);

  const remaining =
    target - spent;


  section.querySelector(
    ".category-spent"
  ).textContent =
    money(spent);


  section.querySelector(
    ".category-target"
  ).textContent =
    money(target);


  const remainingElement =
    section.querySelector(
      ".category-remaining"
    );


  if (remaining >= 0) {

    remainingElement.textContent =
      `${money(remaining)} remaining`;

    remainingElement.style.color =
      category.color;

  } else {

    remainingElement.textContent =
      `${money(Math.abs(remaining))} over budget`;

    remainingElement.style.color =
      "#dc2626";

  }


  const progress =
    target > 0
      ? Math.min(
          (spent / target) * 100,
          100
        )
      : 0;


  section.querySelectorAll(".expense-row").forEach((row, i) => {

    const amount =
      Number(category.expenses[i] && category.expenses[i].amount) || 0;

    row.querySelector(".expense-pct").textContent =
      amount > 0 && target > 0
        ? `${amount / target * 100 < 1 ? "<1" : Math.round(amount / target * 100)}%`
        : "";

  });


  const progressElement =
    section.querySelector(
      ".category-progress"
    );

  progressElement.style.width =
    `${progress}%`;

  progressElement.style.background =
    category.color;

}


function renderOverview() {

  const container =
    document.getElementById(
      "overviewCategories"
    );

  container.innerHTML = "";


  allCategories().forEach(
    category => {

      const spent =
        categorySpent(category);

      const target =
        categoryTarget(category);

      const remaining =
        target - spent;


      const card =
        document.createElement("div");

      card.className =
        "flex items-center gap-2 rounded-full border border-slate-200 px-3 h-7 text-xs whitespace-nowrap";

      card.innerHTML = `
        <span class="w-2.5 h-2.5 rounded-full" style="background:${escapeHtml(category.color)}"></span>
        <span class="font-semibold max-w-[8rem] truncate">${escapeHtml(category.name)}</span>
        ${category.fixed ? "" : `<span class="chip-pct ${totalPercentage() > 100 ? "text-red-600 font-bold" : "text-slate-500"}">${Number(category.percentage)}%</span>`}
        <span class="${remaining >= 0 ? "text-slate-500" : "text-red-500 font-medium"}">${
          remaining >= 0
            ? money(spent) + " / " + money(target)
            : money(Math.abs(remaining)) + " over"}</span>
      `;


      container.appendChild(card);

    }
  );


  const tracked =
    totalTracked();

  const percentage =
    totalBudget() > 0
      ? (tracked / totalBudget()) * 100
      : 0;


  document.getElementById(
    "totalTracked"
  ).textContent =
    `${money(tracked)} tracked`;


  document.getElementById(
    "totalUnallocated"
  ).textContent =
    `${money(Math.max(0, totalBudget() - tracked))} unallocated`;


  document.getElementById(
    "overallPercentage"
  ).textContent =
    `${Math.round(percentage)}%`;


  document.getElementById(
    "overallProgress"
  ).style.width =
    `${Math.min(percentage, 100)}%`;

}


function applyPercentageWarning() {

  const total = totalPercentage();
  const over = total > 100;

  document.querySelectorAll(".category-percentage-input").forEach(input => {
    input.classList.toggle("text-red-600", over);
    input.classList.toggle("!border-red-400", over);
    input.classList.toggle("bg-red-50", over);
    input.parentElement.querySelector("span").classList.toggle("text-red-500", over);
    input.title = over ? `Total is ${total}% (over 100%)` : "";
  });

  document.querySelectorAll("#overviewCategories > div").forEach(chip => {
    chip.classList.toggle("border-red-300", over);
    chip.classList.toggle("bg-red-50", over);
  });

  const banner = document.getElementById("percentWarning");
  banner.classList.toggle("hidden", !over);
  banner.textContent = over
    ? `⚠ Percentages total ${total}% — ${total - 100}% over 100%. Reduce a category.`
    : "";

}


function update() {

  state.income =
    Math.max(
      0,
      Number(
        document.getElementById(
          "income"
        ).value
      ) || 0
    );


  state.duodecimos =
    Math.max(
      0,
      Number(
        document.getElementById("duodecimos").value
      ) || 0
    );


  allCategories().forEach(
    category => {

      const section =
        document.querySelector(
          `[data-category-id="${CSS.escape(category.id)}"]`
        );

      if (section) {

        updateCategoryVisuals(
          section,
          category
        );

      }

    }
  );


  renderOverview();

  applyPercentageWarning();

  saveState();

}


function exportJSON() {

  const data = {
    version: 3,
    exportedAt:
      new Date().toISOString(),

    income:
      state.income,

    duodecimos:
      state.duodecimos,

    duo:
      state.duo,

    categories:
      state.categories
  };


  const blob =
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type: "application/json"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const link =
    document.createElement("a");

  link.href = url;

  link.download =
    "budget-planner.json";

  link.click();


  URL.revokeObjectURL(url);

}


function importJSON(file) {

  const reader =
    new FileReader();


  reader.onload =
    event => {

      try {

        const imported =
          JSON.parse(
            event.target.result
          );


        if (
          !imported ||
          typeof imported !== "object" ||
          !Array.isArray(
            imported.categories
          )
        ) {

          throw new Error(
            "Invalid budget file"
          );

        }


        state = {

          income:
            Number(imported.income) || 0,

          duodecimos:
            Math.max(0, Number(imported.duodecimos) || 0),

          duo:
            normalizeDuo(imported.duo),

          categories:
            imported.categories.map(
              category => ({
                id:
                  category.id ||
                  generateId(),

                name:
                  category.name ||
                  "Category",

                percentage:
                  Math.max(
                    0,
                    Math.min(
                      100,
                      Number(
                        category.percentage
                      ) || 0
                    )
                  ),

                color:
                  /^#[0-9A-Fa-f]{6}$/.test(
                    category.color || ""
                  )
                    ? category.color
                    : "#64748b",

                description:
                  category.description ||
                  "",

                expenses:
                  Array.isArray(
                    category.expenses
                  )
                    ? category.expenses
                    : []
              })
            )

        };


        saveState();

        render();


      } catch {

        alert(
          "Could not import this JSON file."
        );

      }

    };


  reader.readAsText(file);

}


// Income
document
  .getElementById("income")
  .addEventListener(
    "input",
    update
  );


document
  .getElementById("duodecimos")
  .addEventListener(
    "input",
    update
  );


// Export
document
  .getElementById("exportBtn")
  .addEventListener(
    "click",
    exportJSON
  );


// Import
document
  .getElementById("importInput")
  .addEventListener(
    "change",
    event => {

      const file =
        event.target.files[0];

      if (file) {
        importJSON(file);
      }

      event.target.value = "";

    }
  );


// Theme (auto follows the system, or force light/dark)
const THEME_KEY = "budget-theme";
const THEME_MODES = ["auto", "light", "dark"];
const THEME_LABELS = { auto: "🌓 Auto", light: "☀️ Light", dark: "🌙 Dark" };
const systemDark = window.matchMedia("(prefers-color-scheme: dark)");

let themeMode = "auto";
try { themeMode = localStorage.getItem(THEME_KEY) || "auto"; } catch {}
if (!THEME_MODES.includes(themeMode)) themeMode = "auto";

function applyTheme() {
  const dark = themeMode === "dark" || (themeMode === "auto" && systemDark.matches);
  document.documentElement.classList.toggle("dark", dark);
  document.getElementById("themeBtn").textContent = THEME_LABELS[themeMode];
}

document.getElementById("themeBtn").addEventListener("click", () => {
  themeMode = THEME_MODES[(THEME_MODES.indexOf(themeMode) + 1) % THEME_MODES.length];
  try { localStorage.setItem(THEME_KEY, themeMode); } catch {}
  applyTheme();
});

systemDark.addEventListener("change", applyTheme);

applyTheme();


// Initial render
render();

</script>
