<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#f2ebff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#070016" media="(prefers-color-scheme: dark)" />
		<!-- Browser tab icons follow the OS theme: ink mark on light chrome, paper mark on dark. -->
		<link
			rel="icon"
			type="image/svg+xml"
			href="%sveltekit.assets%/favicon/favicon.svg"
			media="(prefers-color-scheme: light)"
		/>
		<link
			rel="icon"
			type="image/svg+xml"
			href="%sveltekit.assets%/favicon_light/favicon.svg"
			media="(prefers-color-scheme: dark)"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="96x96"
			href="%sveltekit.assets%/favicon/favicon-96x96.png"
		/>
		<link rel="shortcut icon" href="%sveltekit.assets%/favicon/favicon.ico" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/favicon/apple-touch-icon.png"
		/>
		<link rel="manifest" href="%sveltekit.assets%/favicon/site.webmanifest" />
		<script>
			// Apply the theme before first paint to avoid a light/dark flash.
			(function () {
				var mode = "auto";
				try {
					mode = localStorage.getItem("offline-suite:theme") || "auto";
				} catch (e) {}
				var dark =
					mode === "dark" ||
					(mode === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.toggle("dark", dark);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
